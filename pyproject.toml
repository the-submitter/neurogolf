[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurogolf"
version = "0.1.0"
description = "Codex-first infrastructure for the 2026 NeuroGolf Championship"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "NeuroGolf contributors" }]
dependencies = [
  "bidict>=0.23,<1",
  "numpy==2.4.4",
  "onnx==1.21.0",
  "onnxruntime==1.24.4",
  "onnx-tool==1.0.1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.25,<5",
  "networkx>=3.5,<4",
  "sympy>=1.14,<2",
  "matplotlib>=3.10,<4",
  "pillow>=12,<13",
  "rich>=14,<15",
  "typer>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.140,<7",
  "pyright>=1.1.400,<2",
  "pytest>=9,<10",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.14,<1",
]

[project.scripts]
neurogolf = "neurogolf.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurogolf*"]

[tool.setuptools.package-data]
neurogolf = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests involving real repository data or ONNX Runtime",
  "parity: comparisons against the immutable official utility",
  "slow: intentionally broad validation tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "ARC-GEN",
  "build",
  "notebooks",
  "tasks",
  "utils/neurogolf_utils.py",
  "utils/the-2026-neurogolf-championship.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["neurogolf", "scripts", "tests"]
exclude = ["ARC-GEN", "tasks"]
pythonVersion = "3.12"
venvPath = "/home/rohit-raje"
venv = ".venv"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingModuleSource = false
