scorer:
  input_name: input
  output_name: output
  channels: 10
  height: 30
  width: 30
  file_size_limit_bytes: 1509949
  ir_version: 10
  # Null means any standard-domain opset accepted by the pinned ONNX and
  # ONNX Runtime versions. Individual operators still enforce their minimum.
  opset: null
  excluded_ops:
    - LOOP
    - SCAN
    - NONZERO
    - UNIQUE
    - SCRIPT
    - FUNCTION
    - COMPRESS
